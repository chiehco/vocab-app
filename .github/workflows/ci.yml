name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5 Pillow==12.0.0
      - run: python -m unittest discover -s scripts -p 'test_apply_lv3_*.py'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
