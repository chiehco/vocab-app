<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拼字守城</title><style>:root{color-scheme:light dark}html,body{margin:0;padding:0}button{cursor:pointer}button:disabled{cursor:default}</style></head><body>
<div id="word-siege">
 <header><span>萬詞譜 · 即時守城</span><button id="ws-pause">暫停</button><button id="ws-reset">重玩</button></header>
 <div class="ws-hud"><b id="ws-time">守住 60 秒</b><span id="ws-health">城堡 100</span><span id="ws-score">0 分</span></div>
 <div class="ws-health"><span id="ws-hp"></span></div>
 <div id="ws-field" role="group" aria-label="敵人從右側逼近城堡的戰場">
  <div class="ws-path"></div><div class="ws-wall ws-top"></div><div class="ws-wall ws-bottom"></div><div class="ws-castle">🏰<small>守住城堡</small></div>
  <div id="ws-army"></div><div id="ws-enemies"></div><div id="ws-fx"></div><div id="ws-banner">援軍 · 冰凍 · 爆破</div>
  <div id="ws-cover"><h2>拼字，守住這一波</h2><p>敵人不會等你。<br>選招式，看中文拼英文，立即出招。</p><button id="ws-start">開始守城 · 60 秒</button><small>使用所選 Unit 的單字</small></div>
 </div>
 <div id="ws-status" role="status" aria-live="polite">先召喚援軍，再用冰凍和爆破救場。</div>
 <div id="ws-controls"><div id="ws-skills" aria-label="選擇要施放的招式"></div><div class="ws-prompt"><span id="ws-meaning"></span><button id="ws-hint">提示</button></div><div id="ws-answer" aria-live="polite" aria-label="目前拼字"></div><div id="ws-board" aria-label="字母盤"></div><div class="ws-tools"><button id="ws-undo">撤回</button><span>不限相鄰 · 拼對立即出招</span><button id="ws-clear">清空</button></div></div>
 <div id="ws-result" hidden></div>
</div>
<style>
#word-siege{--ws-bg:light-dark(#f3f0e3,#242d28);--ws-ink:light-dark(#253a2d,#eaf0dc);--ws-muted:light-dark(#566953,#bfccba);--ws-panel:light-dark(#fffdf2,#35483b);--ws-green:light-dark(#346047,#b3d399);--ws-on:light-dark(#fffef1,#253627);--ws-grass:light-dark(#cadba9,#354f36);--ws-path:light-dark(#dcd0a5,#655c3e);--ws-edge:light-dark(#9da98b,#5a715e);--ws-stone:light-dark(#c0c4ac,#656e60);--ws-ice:light-dark(#d7f4ff,#427388);--ws-fire:light-dark(#fcb957,#c57927);--ws-red:light-dark(#a43b2e,#ffac9b);font:14px/1.4 system-ui,'Microsoft JhengHei',sans-serif;max-width:440px;margin:auto;padding:14px;background:var(--ws-bg);color:var(--ws-ink);border-radius:18px}#word-siege *{box-sizing:border-box}#word-siege [hidden]{display:none!important}#word-siege button{font:inherit;color:inherit;min-height:44px;background:var(--ws-panel);border:1px solid var(--ws-edge);border-radius:8px;touch-action:manipulation}#word-siege button:disabled{opacity:.5}#word-siege header{display:flex;align-items:center;gap:8px;font-size:12px}#word-siege header span{margin-right:auto}#word-siege header button{border:0;background:none;padding:4px 6px}#word-siege .ws-hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;margin:3px 0 8px}#word-siege .ws-health{height:5px;background:var(--ws-edge);margin-bottom:8px;overflow:hidden;border-radius:3px}#word-siege #ws-hp{height:100%;display:block;background:var(--ws-green);width:100%}
#word-siege #ws-field{height:260px;position:relative;background:var(--ws-grass);border-radius:10px;overflow:hidden}#word-siege .ws-path{position:absolute;top:80px;height:110px;width:100%;background:var(--ws-path);clip-path:polygon(0 20%,100% 0,100% 100%,0 80%)}#word-siege .ws-wall{position:absolute;left:28%;width:22px;background:repeating-linear-gradient(0deg,transparent 0 21px,var(--ws-edge) 21px 24px),var(--ws-stone);border:2px solid var(--ws-edge);height:79px}#word-siege .ws-top{top:0}#word-siege .ws-bottom{bottom:0}#word-siege .ws-castle{position:absolute;left:1%;top:102px;font-size:42px}#word-siege .ws-castle small{display:block;font-size:11px;text-align:center}#word-siege .ws-enemy{position:absolute;font-size:25px;transform:translate(-50%,-50%)}#word-siege .ws-enemy small{display:block;height:3px;background:var(--ws-red);margin:0 auto;max-width:28px}#word-siege .ws-enemy.frozen{background:var(--ws-ice);border-radius:7px}#word-siege .ws-soldier{position:absolute;font-size:25px}#word-siege #ws-banner{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12px;font-weight:600}#word-siege .ws-burst{position:absolute;width:115px;height:115px;border-radius:50%;background:var(--ws-fire);opacity:.8;transform:translate(-50%,-50%);animation:ws-burst .6s forwards;display:grid;place-items:center;font-size:42px}#word-siege .ws-bolt{position:absolute;font-size:26px;animation:ws-bolt .4s forwards}#word-siege #ws-cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--ws-panel);padding:15px}#word-siege #ws-cover h2{font-size:24px;margin:0}#word-siege #ws-cover p{font-size:13px}#word-siege #ws-cover button,#word-siege #ws-result button{background:var(--ws-green);color:var(--ws-on);padding:10px 20px;border:0}#word-siege #ws-cover small{font-size:11px;margin-top:12px;color:var(--ws-muted)}
#word-siege #ws-status{min-height:43px;display:flex;align-items:center;font-size:12px;color:var(--ws-green);font-weight:600}#word-siege #ws-skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#word-siege #ws-skills button{padding:7px 2px;font-size:13px}#word-siege #ws-skills small{display:block;font-size:12px;margin-top:3px}#word-siege #ws-skills button[aria-pressed=true]{background:var(--ws-green);color:var(--ws-on)}#word-siege .ws-prompt{display:flex;align-items:center;justify-content:space-between;margin-top:8px}#word-siege #ws-meaning{font-size:18px;font-weight:600}#word-siege #ws-hint{border:0;background:none;font-size:12px;padding:5px 12px}#word-siege #ws-answer{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:0 0 10px}#word-siege .ws-slot{font-size:22px;font-weight:700;width:31px;height:32px;text-align:center;border-bottom:2px solid var(--ws-edge)}#word-siege #ws-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:7px;background:var(--ws-edge);border-radius:10px}#word-siege .ws-letter{height:44px;min-width:0;font-size:23px;font-weight:700;position:relative}#word-siege .ws-letter small{position:absolute;right:3px;top:0;font-size:11px}#word-siege .ws-letter[aria-pressed=true]{background:var(--ws-green);color:var(--ws-on)}#word-siege .ws-tools{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ws-muted)}#word-siege .ws-tools button{border:0;background:none;padding:5px 10px;font-size:12px}#word-siege #ws-result{text-align:center;padding:18px 0}#word-siege #ws-result h2{font-size:24px}#word-siege #ws-result p{font-size:14px}
@keyframes ws-burst{from{scale:.3;opacity:1}to{scale:1.5;opacity:0}}@keyframes ws-bolt{from{translate:0 0;opacity:1}to{translate:90px 0;opacity:0}}@media(max-width:360px){#word-siege{padding:10px}#word-siege #ws-board{gap:4px;padding:6px}}@media(prefers-reduced-motion:reduce){#word-siege *{animation:none!important}}
</style>
<script>
(()=>{
const root=document.getElementById('word-siege'),q=id=>root.querySelector('#ws-'+id);
const words=/* SIEGE_WORDS */;
const names=['🏹 援軍','❄ 冰凍','💥 爆破'];
let s,selected=[],mode='ready',notice='先召喚援軍，再用冰凍和爆破救場。',last=performance.now(),fxUntil=0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function board(){const a=[...words[s.tasks[s.choice]][0]];while(a.length<25)a.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]);s.board=shuffle(a);selected=[];}
let deck=[];
function nextWord(exclude=[]){if(!deck.length)deck=shuffle(Array.from({length:words.length},(_,i)=>i));let at=deck.findIndex(i=>!exclude.includes(i));if(at<0){deck=shuffle(Array.from({length:words.length},(_,i)=>i));at=deck.findIndex(i=>!exclude.includes(i));}return deck.splice(Math.max(0,at),1)[0];}
const escapeHtml=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function spawn(){s.enemies.push({id:s.uid++,x:94+Math.random()*3,y:91+Math.random()*78,hp:40+Math.floor(s.time/20)*15,hit:0});}
function fresh(){s={kind:'siege-v1',time:0,hp:100,score:0,army:0,kills:0,casts:[0,0,0],tasks:[0,1,2],choice:0,board:[],enemies:[],uid:1,spawn:0,shot:0,slow:0,clean:0,hint:false,wrong:false};deck=[];s.tasks=[nextWord(),nextWord(),nextWord()];selected=[];mode='ready';notice='先召喚援軍，再用冰凍和爆破救場。';board();spawn();spawn();spawn();s.enemies.forEach((e,i)=>e.x=76+i*8);q('fx').innerHTML='';}

function field(){q('time').textContent='剩餘 '+Math.max(0,Math.ceil(60-s.time))+' 秒';q('health').textContent='城堡 '+Math.max(0,Math.ceil(s.hp));q('score').textContent=s.score+' 分';q('hp').style.width=Math.max(0,s.hp)+'%';q('enemies').innerHTML=s.enemies.map(e=>`<span class="ws-enemy ${s.slow>0?'frozen':''}" style="left:${e.x}%;top:${e.y}px">👾<small style="width:${Math.max(2,e.hp/70*28)}px"></small></span>`).join('');q('army').innerHTML=Array.from({length:Math.min(s.army,6)},(_,i)=>`<span class="ws-soldier" style="left:${13+i%2*10}%;top:${71+Math.floor(i/2)*38}px">🏹</span>`).join('');q('banner').textContent=s.slow>0?'冰凍緩速 · '+Math.ceil(s.slow)+' 秒':s.army?'援軍 '+s.army+' 位 · 自動射擊':'敵軍正逼近缺口';q('field').setAttribute('aria-label',`戰場：${s.enemies.length} 個敵人，${s.army} 位援軍，城堡生命 ${Math.ceil(s.hp)}`);}
function controls(){q('status').textContent=notice;q('skills').innerHTML=names.map((n,i)=>`<button class="cursor-interaction" data-skill="${i}" aria-pressed="${s.choice===i}" ${mode!=='running'?'disabled':''}>${n}<small>${escapeHtml(words[s.tasks[i]][1])}</small></button>`).join('');q('skills').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.choice=Number(b.dataset.skill);board();s.hint=false;s.wrong=false;notice='拼出「'+words[s.tasks[s.choice]][1]+'」施放'+names[s.choice];controls();});q('meaning').textContent=words[s.tasks[s.choice]][1];q('answer').innerHTML=[...words[s.tasks[s.choice]][0]].map((_,i)=>`<span class="ws-slot">${selected[i]===undefined?'·':s.board[selected[i]]}</span>`).join('');q('board').innerHTML=s.board.map((c,i)=>`<button class="ws-letter cursor-interaction" data-letter="${i}" aria-label="字母 ${c}，第 ${i+1} 格" aria-pressed="${selected.includes(i)}" ${mode!=='running'?'disabled':''}>${c}${selected.includes(i)?'<small>'+(selected.indexOf(i)+1)+'</small>':''}</button>`).join('');q('board').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(Number(b.dataset.letter)));q('hint').disabled=mode!=='running';q('undo').disabled=q('clear').disabled=mode!=='running'||!selected.length;}
function render(){field();controls();q('cover').hidden=mode==='running'||mode==='done';q('cover').querySelector('h2').textContent=mode==='paused'?'戰場已暫停':'拼字，守住這一波';q('start').textContent=mode==='paused'?'繼續守城':'開始守城 · 60 秒';q('pause').textContent=mode==='paused'?'繼續':'暫停';q('pause').disabled=mode==='ready'||mode==='done';q('controls').hidden=mode==='done';q('result').hidden=mode!=='done';if(mode==='done'){q('result').innerHTML=`<h2>${s.hp>0?'守住了！':'城堡失守了'}</h2><p>${s.score} 分 · 擊退 ${s.kills} 個敵人<br>援軍 ${s.casts[0]} 次 · 冰凍 ${s.casts[1]} 次 · 爆破 ${s.casts[2]} 次</p><button class="cursor-interaction">再守一場</button>`;q('result').querySelector('button').onclick=restart;}}
function pick(i){if(mode!=='running')return;const pos=selected.indexOf(i);if(pos>=0)selected.splice(pos);else if(selected.length<words[s.tasks[s.choice]][0].length)selected.push(i);const word=words[s.tasks[s.choice]][0];if(selected.length===word.length){if(selected.map(i=>s.board[i]).join('')===word){cast();return;}s.wrong=true;notice='拼字還不對，撤回修改；敵人還在前進！';}controls();}
function reap(){const dead=s.enemies.filter(e=>e.hp<=0).length;s.kills+=dead;s.score+=dead*50;s.enemies=s.enemies.filter(e=>e.hp>0);}
function cast(){const k=s.choice,word=words[s.tasks[k]][0];s.score+=s.hint||s.wrong?60:100;if(!s.hint&&!s.wrong)s.clean++;s.casts[k]++;if(k===0){s.army++;notice=word+'！援軍加入，持續自動攻擊。';}else if(k===1){s.slow=8;notice=word+'！全場敵人減速 80%，持續 8 秒。';}else{const front=s.enemies.reduce((a,e)=>!a||e.x<a.x?e:a,null);if(front){let n=0;for(const e of s.enemies)if(Math.abs(e.x-front.x)<=25){e.hp-=90;n++;}q('fx').innerHTML=`<div class="ws-burst" style="left:${front.x}%;top:130px">💥</div>`;fxUntil=s.time+.65;reap();notice=word+'！爆破擊中 '+n+' 個敵人！';}else notice=word+'！戰場已清空，爆破沒有命中。';}s.tasks[k]=nextWord(s.tasks);s.hint=false;s.wrong=false;board();render();}
function tick(dt){s.time+=dt;s.slow=Math.max(0,s.slow-dt);s.spawn+=dt;s.shot+=dt;if(s.spawn>=3.5&&s.time<52){s.spawn=0;spawn();spawn();if(s.time>30)spawn();}for(const e of s.enemies){e.x=Math.max(10,e.x-(2.8+s.time*.022)*(s.slow>0?.2:1)*dt);if(e.x<=10){e.hit+=dt;if(e.hit>=1){e.hit=0;s.hp-=8;}}}if(s.shot>=.8){s.shot=0;for(let i=0;i<s.army;i++){const front=s.enemies.filter(e=>e.hp>0).sort((a,b)=>a.x-b.x)[0];if(front)front.hp-=16;}if(s.army&&s.enemies.length){q('fx').innerHTML='<span class="ws-bolt" style="left:25%;top:115px">➶</span>';fxUntil=s.time+.4;}reap();}if(s.time>fxUntil)q('fx').innerHTML='';if(s.hp<=0||s.time>=60){s.hp=Math.max(0,s.hp);s.time=Math.min(60,s.time);mode='done';notice=s.hp>0?'敵軍撤退，守城成功！':'防線被突破，再試試冰凍和爆破。';render();}else field();}
function resume(){mode='running';last=performance.now();notice='敵人正在前進！選招式，拼字出招。';render();}function pause(){if(mode==='running'){mode='paused';render();}else if(mode==='paused')resume();}function restart(){fresh();render();}
q('start').onclick=resume;q('pause').onclick=pause;q('reset').onclick=restart;q('hint').onclick=()=>{if(mode!=='running')return;s.hint=true;notice='提示：'+words[s.tasks[s.choice]][0]+' · 敵人仍在前進';controls();};q('undo').onclick=()=>{selected.pop();controls();};q('clear').onclick=()=>{selected=[];controls();};
fresh();render();root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
const interval=setInterval(()=>{if(!root.isConnected){clearInterval(interval);return;}const now=performance.now(),dt=Math.max(0,Math.min(.25,(now-last)/1000));last=now;if(mode==='running'&&!document.hidden)tick(dt);},100);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')pause();});new ResizeObserver(()=>parent.postMessage({type:'siege-height',height:root.getBoundingClientRect().height},'*')).observe(root);
})();
</script>

</body></html>
